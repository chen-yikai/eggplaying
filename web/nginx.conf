map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 32k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    # Resolved per request, so nginx survives the API container being recreated.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Chat sockets stay open; the API pings them every 30 seconds.
    proxy_read_timeout 90s;
  }

  # Bundles have content hashes in their names, so they can be cached for good.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
